# Bump a plugin's `version` in its Cargo.toml and in index.json and merge to master to ship it. Every push builds
# the plugins whose index.json version changed (scripts/plan.mjs), each on its own OS, and publishes a GitHub
# Release tagged with the UTC date and time (v2026.11.02-2341). The release always holds every
# plugin: the ones that did not change are copied over from the previous release (scripts/reuse.mjs).
# Each plugin ships as <dir>_<os>_<version>.knobdeck plus <dir>_<os>_manifest.json (and readme/icon);
# the website repo pulls the latest release on its own schedule to build its registry. Pull requests only build.
name: release
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  GH_TOKEN: ${{ github.token }}
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      tag: ${{ steps.plan.outputs.tag }}
      prev: ${{ steps.plan.outputs.prev }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        run: |
          prev=$(gh release list --limit 1 --json tagName -q '.[0].tagName')
          mkdir prev
          # A release without manifests (made before this scheme) counts as no previous release.
          if [ -n "$prev" ]; then gh release download "$prev" -p '*_manifest.json' -D prev || true; fi
          if [ -z "$(ls prev)" ]; then prev=""; fi
          echo "prev=$prev" >> "$GITHUB_OUTPUT"
          echo "matrix=$(node scripts/plan.mjs prev)" >> "$GITHUB_OUTPUT"
          echo "tag=v$(date -u +%Y.%m.%d-%H%M)" >> "$GITHUB_OUTPUT"
  build:
    needs: plan
    if: needs.plan.outputs.matrix != '{"include":[]}'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install knobdeck-plugin
        run: cargo install --git https://github.com/HarshalKudale/arclet-sdk-rust --bin knobdeck-plugin --locked
      - name: Discord build-time settings
        shell: bash
        run: |
          printf 'DISCORD_CLIENT_ID=%s\nKNOBDECK_DISCORD_TOKEN_URL=%s\n' \
            '${{ vars.DISCORD_CLIENT_ID }}' '${{ vars.KNOBDECK_DISCORD_TOKEN_URL }}' > discord/.env
      - name: Package plugins
        shell: bash
        run: |
          for d in ${{ matrix.plugins }}; do
            (cd "$d" && knobdeck-plugin build && knobdeck-plugin package)
          done
          node scripts/stage.mjs ${{ matrix.name }} ${{ matrix.plugins }}
      - uses: actions/upload-artifact@v4
        with: { name: "bundles-${{ matrix.name }}", path: "out/*" }
  publish:
    needs: [plan, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: "bundles-*", path: out, merge-multiple: true }
      - name: Add the unchanged plugins from the previous release
        if: needs.plan.outputs.prev != ''
        run: |
          mkdir prev
          gh release download "${{ needs.plan.outputs.prev }}" -p '*_manifest.json' -D prev
          node scripts/reuse.mjs "${{ needs.plan.outputs.prev }}" prev
      - name: Release
        run: gh release create "${{ needs.plan.outputs.tag }}" out/* --target "$GITHUB_SHA" --generate-notes
